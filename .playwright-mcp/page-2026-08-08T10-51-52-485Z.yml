          - generic [ref=f17e111]:
            - heading "01 What are Blood Relations? 🧬" [level=2] [ref=f17e112]:
              - generic [ref=f17e113]: "01"
              - text: What are Blood Relations? 🧬
            - paragraph [ref=f17e114]: Blood relation questions test your ability to map out family connections[reference:0]. You must track generations (grandparents, parents, children), genders (male/female), and specific roles (brother, sister, uncle, aunt). These relations can be direct like parents and children, or indirect like uncles, aunts, and cousins[reference:1]. The golden rule is to never assume genders unless explicitly stated, and always draw a family tree[reference:2]!
            - paragraph [ref=f17e115]: Blood relations are all about figuring out how people are connected through family! Think of it like building a family tree from the roots to the leaves.
            - paragraph [ref=f17e116]:
              - strong [ref=f17e117]: "The Golden Rule: Draw it Out!"
              - text: — Never try to solve these purely in your head. The human brain gets tangled in 'my mother's brother's son'. Always draw a quick family tree on your rough sheet[reference:3].
            - paragraph [ref=f17e118]:
              - strong [ref=f17e119]: Generations Matter
              - text: — Always figure out which generation each person belongs to[reference:5]. Grandparents are +2, Parents/Uncles/Aunts are +1, Self/Siblings/Cousins are 0, Children/Nieces/Nephews are -1, Grandchildren are -2[reference:6].
            - paragraph [ref=f17e120]:
              - strong [ref=f17e121]: The Gender Trap
              - text: — Never assume the gender of a person based on their name or profession unless the question explicitly states it[reference:7]. 'Doctor' can be male or female.
            - paragraph [ref=f17e122]:
              - strong [ref=f17e123]: Blood Relation vs Marriage Relations
              - text: — Blood relations are connections by birth. Marriage relations (in-laws) are connections created through marriage[reference:9]. Both are tested in exams!
          - generic [ref=f17e124]:
            - heading "02 Types of Blood Relation Questions 🔍" [level=2] [ref=f17e125]:
              - generic [ref=f17e126]: "02"
              - text: Types of Blood Relation Questions 🔍
            - paragraph [ref=f17e127]: Understanding the format saves time[reference:13]. Pointing questions are solved by working backward from the end of the sentence. Coded questions are solved by replacing symbols with actual relations[reference:14]. Puzzle questions require drawing a complete chart[reference:15].
            - paragraph [ref=f17e128]: "Questions usually come in three flavors: Pointing (who is in the photo?), Coded (math-like symbols), and Puzzles (a whole family story)."
            - paragraph [ref=f17e129]:
              - strong [ref=f17e130]: "Type 1: Pointing / Indicating"
              - text: — Someone points to a photo or a person and describes them[reference:16]. Solve by starting from the last relation mentioned and working backward to the speaker[reference:17].
            - paragraph [ref=f17e131]:
              - strong [ref=f17e132]: "Type 2: Coded Relations"
              - text: — Relations are hidden behind symbols (+, -, *, /) or words[reference:19]. You must decode the symbol first, then chain them together[reference:20].
            - paragraph [ref=f17e133]:
              - strong [ref=f17e134]: "Type 3: Family Puzzles"
              - text: — A paragraph describes a family with conditions (e.g., 'There are two married couples', 'No two males sit together')[reference:22]. You must build the whole tree[reference:23].
          - generic [ref=f17e135]:
            - heading "03 Generational Mapping & Symbols 🗺️" [level=2] [ref=f17e136]:
              - generic [ref=f17e137]: "03"
              - text: Generational Mapping & Symbols 🗺️
            - paragraph [ref=f17e138]: Think of a family tree like a building[reference:27]. The top floor is Grandparents (+2 generation). The middle floor is Parents, Uncles, Aunts (+1 generation). The ground floor is You, Siblings, Cousins (0 generation). The basement is Children, Nieces, Nephews (-1 generation)[reference:28].
            - paragraph [ref=f17e139]: A family tree has levels (generations) and lines (relationships). Master the symbols to map anyone instantly!
            - paragraph [ref=f17e140]:
              - strong [ref=f17e141]: The Symbols Cheat Sheet
              - text: "— Male: Square [ ] or (+). Female: Circle ( ) or (-). Marriage: Double line (=). Siblings: Single horizontal line (-). Parent-Child: Single vertical line (|)[reference:29][reference:30]."
            - paragraph [ref=f17e142]:
              - strong [ref=f17e143]: Maternal vs Paternal
              - text: — Paternal = Father's side (Paternal Uncle = Father's brother). Maternal = Mother's side (Maternal Uncle = Mother's brother)[reference:32].
            - paragraph [ref=f17e144]:
              - strong [ref=f17e145]: In-Law Relations
              - text: — Spouse's parents = Father-in-law / Mother-in-law. Spouse's siblings = Brother-in-law / Sister-in-law. Sibling's spouse = Also Brother/Sister-in-law.[reference:34][reference:35]
          - generic [ref=f17e146]:
            - heading "04 5 Question Patterns You Must Know 🎯" [level=2] [ref=f17e147]:
              - generic [ref=f17e148]: "04"
              - text: 5 Question Patterns You Must Know 🎯
            - paragraph [ref=f17e149]: We've categorized all campus test blood relation questions into 5 core patterns[reference:40]. Master these, and you can solve any variation.
            - paragraph [ref=f17e150]: Every blood relation question fits a pattern. Recognize it, apply the trick, and solve in 30 seconds!
            - paragraph [ref=f17e151]:
              - strong [ref=f17e152]: "Pattern 1: The 'Backward Tracking' Pointing"
              - text: "— Question: 'Pointing to a man, a woman said, 'He is the son of my father's only daughter.' How is the man related to the woman?[reference:41]"
            - paragraph [ref=f17e153]:
              - strong [ref=f17e154]: "Pattern 2: The 'Coded Chain'"
              - text: "— Question: If A $ B means A is brother of B, A @ B means A is wife of B. Find relation in P $ Q @ R.[reference:43]"
            - paragraph [ref=f17e155]:
              - strong [ref=f17e156]: "Pattern 3: The 'Only Son/Daughter' Trap"
              - text: "— Question: 'I have no brother or sister, but that man's son is my father's son.'[reference:45]"
            - paragraph [ref=f17e157]:
              - strong [ref=f17e158]: "Pattern 4: The 'Multi-Generation Puzzle'"
              - text: "— Question: A family of 6. A and B are a couple. C is their son. D is C's wife. E is D's brother. How is E related to A?[reference:47]"
            - paragraph [ref=f17e159]:
              - strong [ref=f17e160]: "Pattern 5: The 'Gender Unknown' Trick"
              - text: "— Question: A is the child of B. But B is not the father of A. Who is B?[reference:49]"
          - generic [ref=f17e161]:
            - 'heading "05 Quick Reference: The Blood Relation Method ✅" [level=2] [ref=f17e162]':
              - generic [ref=f17e163]: "05"
              - text: "Quick Reference: The Blood Relation Method ✅"
            - paragraph [ref=f17e164]: Follow these 4 steps every single time[reference:53]. They work for all patterns and guarantee accuracy.
            - paragraph [ref=f17e165]: Your ultimate cheat sheet to solve any blood relation question in under 45 seconds.
            - paragraph [ref=f17e166]:
              - strong [ref=f17e167]: "Step 1: Read & Identify"
              - text: — Read the question. Is it Pointing, Coded, or a Puzzle? This decides your approach[reference:54].
            - paragraph [ref=f17e168]:
              - strong [ref=f17e169]: "Step 2: Break it Down"
              - text: — For pointing, break the sentence at 'my', 'his', 'her'. For coded, write the meaning of each symbol next to it[reference:56].
            - paragraph [ref=f17e170]:
              - strong [ref=f17e171]: "Step 3: Draw the Mini-Tree"
              - text: — Use your rough sheet[reference:58]. Draw boxes for males, circles for females. Connect them[reference:59]. Don't rely on memory[reference:60].
            - paragraph [ref=f17e172]:
              - strong [ref=f17e173]: "Step 4: The 'Reverse Check'"
              - text: — Once you find the answer, read the relationship backward to see if it makes sense[reference:62].
