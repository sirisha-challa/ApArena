<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Arena · ApArena — AXIS 2026 SQL track</title>
  <meta name="description" content="SQLArena: 34 AXIS-pattern SQL problems with in-browser SQLite, schemas, hidden tests and a Basics-to-Mastery learn path.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230284C7'/%3E%3Ctext x='16' y='22' font-size='13' font-family='monospace' fill='white' text-anchor='middle'%3ESQL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/coding/coding.css">
  <link rel="stylesheet" href="/sqlarena/sqlarena.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-icon" aria-hidden="true">A</span>
          <a class="brand-text" href="/" style="text-decoration:none;color:inherit">ApArena</a>
          <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Arena navigation"></nav>
        <div class="sidebar-footer">
          <div id="sidebar-progress">
            <div class="sidebar-progress-label">Solved</div>
            <div class="progress-bar"><div id="sidebar-progress-fill" style="width:0%"></div></div>
            <div id="sidebar-progress-text" style="margin-top:6px;font-family:var(--font-mono);font-size:11px;">0 / 0</div>
          </div>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <div class="main-area">
        <header class="topbar">
          <button class="hamburger" id="hamburger" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <button class="hamburger" id="back-button" hidden aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          </button>
          <div class="topbar-title" id="header-title">SQL Arena</div>
          <div class="topbar-actions">
            <a class="nav-link" href="/coding/" style="font-size:12px;font-weight:600;padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);text-decoration:none">&lt;/&gt; Coding</a>
            <button class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode"></button>
            <button class="menu-toggle" id="menu-toggle">Menu</button>
          </div>
        </header>
        <main class="content"><div class="page-content" id="app-content"></div></main>
        <footer class="app-footer">SQL Arena · AXIS 2026 SQL track · SQLite in-browser</footer>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="/sqlarena/sql-judge.js"></script>
  <script src="/sqlarena/app.js"></script>
</body>
</html>
