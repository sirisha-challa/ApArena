<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCS Arena — ApArena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0d12; --panel:#16161e; --panel-2:#1b1b25; --border:#262633; --text:#e8e8f0; --muted:#9b9bab; --acc:#a100ff; }
  html[data-theme="light"] { --bg:#f4f4f8; --panel:#fff; --panel-2:#fafafe; --border:#e4e4ef; --text:#17171f; --muted:#5d5d70; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  .wrap { max-width:720px; margin:0 auto; padding:64px 24px; text-align:center; flex:1; }
  .icon { width:64px; height:64px; margin:0 auto 20px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,#22d3ee,#2563eb); font-size:28px; font-weight:700; color:#fff; }
  h1 { font-family:'Space Grotesk',sans-serif; font-size:32px; margin-bottom:8px; }
  p { color:var(--muted); line-height:1.6; margin-bottom:24px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:32px; }
  .chip { font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  a.back { display:inline-block; color:var(--acc); font-weight:600; text-decoration:none; }
  a.back:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">TCS</div>
  <h1>TCS Arena</h1>
  <p>The TCS NQT dashboard will live here — syllabus-driven prep with the same topic flow: learn, formulas, practice and MCQs. Bank topics open inside the relevant bank.</p>
  <div class="chips"><span class="chip">TCS NQT</span><span class="chip">Coming soon</span></div>
  <a class="back" href="/">← Back to landing</a>
</div>
</body>
</html>
