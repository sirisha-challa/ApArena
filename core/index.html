<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core — ApArena</title>
  <meta name="description" content="Core CS, Networking, Cloud & Office — the technical MCQ core — ApArena Core bank with Learn, Formulas, Practice and MCQ tabs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <meta name="color-scheme" content="light dark">
</head>
<body data-bank="core">
  <div id="app">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-icon" aria-hidden="true">A</span>
          <a class="brand-text" href="/" style="text-decoration:none;color:inherit">ApArena</a>
          <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Bank navigation"></nav>
        <div class="sidebar-footer">
          <div id="sidebar-progress">
            <div class="sidebar-progress-label">Progress</div>
            <div class="progress-bar"><div id="sidebar-progress-fill" style="width:0%"></div></div>
            <span id="sidebar-progress-text">0%</span>
          </div>
        </div>
      </aside>
      <div class="main-area">
        <header class="topbar">
          <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">&#9776;</button>
          <button class="back-button" id="back-button" type="button" aria-label="Go back" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>
            <span>Back</span>
          </button>
          <h1 class="topbar-title" id="header-title">Dashboard</h1>
          <div class="topbar-actions">
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">Menu</button>
            <div id="toast-container" class="toast-container"></div>
            <button class="theme-btn" id="theme-toggle" aria-label="Toggle theme">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            </button>
          </div>
        </header>
        <main class="content" id="app-content"></main>
        <footer class="app-footer">ApArena — <a href="/">All Banks</a> · <span id="bank-footer-meta">Core Bank</span></footer>
      </div>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Primary">
      <button class="bottom-nav-item active" data-view="dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Home</span></button>
      <button class="bottom-nav-item" data-view="roadmap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Roadmap</span></button>
      <button class="bottom-nav-item" data-view="learn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg><span>Learn</span></button>
      <button class="bottom-nav-item" data-view="mcq"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>MCQ</span></button>
    </nav>
  </div>
  <script>
    window.AP_BANK_ID = "core";
  </script>
  <script src="/js/bank-boot.js"></script>
</body>
</html>
