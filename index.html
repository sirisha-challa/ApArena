<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApArena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235B4DFF'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='32' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .nav{max-width:1200px;margin:0 auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
  .brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5B4DFF,#06B6D4);display:grid;place-items:center;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(91,77,255,.35)}
  .brand-text strong{font-family:var(--font-display);font-size:16px;letter-spacing:-.01em}
  .nav-actions{display:flex;gap:8px;align-items:center}
  .nav-link{font-size:13px;font-weight:600;padding:7px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);text-decoration:none;transition:.15s}
  .nav-link:hover{color:var(--text);border-color:var(--border-2)}
  .nav-link.accent{background:linear-gradient(135deg,#5B4DFF,#06B6D4);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(91,77,255,.25)}
  .wrap{max-width:1200px;margin:0 auto;padding:8px 24px 44px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 18px;flex-wrap:wrap}
  .section-head h2{font-family:var(--font-display);font-size:18px;letter-spacing:-.01em;margin:0}
  .section-head .count{font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
  .search{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:260px;transition:.15s}
  .search:focus-within{border-color:var(--accent-soft-2)}
  .search svg{width:16px;height:16px;color:var(--text-3);flex:none}
  .search input{flex:1;background:transparent;border:none;outline:none;font:inherit;color:var(--text);font-size:13px}
  .search input::placeholder{color:var(--text-3)}
  .loader{display:flex;gap:10px;align-items:center;color:var(--text-3);font-size:13px;margin:18px 0}
  .spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{padding:24px;text-align:center;color:var(--text-3);font-size:13px;border:1px dashed var(--border);border-radius:12px}
</style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="brand"><span class="brand-mark">A</span><span class="brand-text"><strong>ApArena</strong></span></a>
    <div class="nav-actions">
      <a class="nav-link" href="/coding/">&lt;/&gt; Coding Arena</a>
    </div>
  </nav>

  <div class="wrap">
    <section>
      <div class="section-head">
        <div><h2>Banks</h2><span class="count" id="nav-stats">–</span></div>
        <label class="search" aria-label="Filter banks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="bank-search" type="search" placeholder="Filter…">
        </label>
      </div>
      <div class="loader" id="bank-loader"><span class="spin"></span> Loading…</div>
      <div class="grid" id="grid" hidden></div>
      <div id="empty" hidden class="empty-state">No banks match your filter.</div>
    </section>
  </div>

  <footer class="app-footer" style="max-width:1200px;margin:18px auto 0">ApArena</footer>

<script>
(function(){
  var BANKS_FALLBACK = [
    {id:'aptitude', title:'Aptitude', subtitle:'Quantitative Aptitude', color:'#5B4DFF', icon:'Σ', accent:'aptitude'},
    {id:'reasoning', title:'Reasoning', subtitle:'Logical Reasoning', color:'#DC2626', icon:'◈', accent:'reasoning'},
    {id:'verbal', title:'Verbal', subtitle:'Verbal & English', color:'#059669', icon:'A', accent:'verbal'},
    {id:'pseudocode', title:'Pseudocode', subtitle:'Trace & predict output', color:'#7C3AED', icon:'</>', accent:'pseudocode'},
    {id:'programming', title:'Programming', subtitle:'DSA, SQL & UI tasks', color:'#2563EB', icon:'{}', accent:'programming'},
    {id:'core', title:'Core', subtitle:'Core CS, Networking, Cloud & Office', color:'#0D9488', icon:'⬢', accent:'core'},
    {id:'behavioural', title:'Behavioural', subtitle:'Personality & work-style', color:'#5B4DFF', icon:'♥', accent:'behavioural'},
    {id:'gamified', title:'Gamified', subtitle:'Memory, quick math & pattern games', color:'#F59E0B', icon:'◐', accent:'gamified'},
    {id:'communication', title:'Communication', subtitle:'Fluency & pronunciation', color:'#0284C7', icon:'🎤', accent:'communication'},
    {id:'coding', title:'Coding Arena', subtitle:'In-browser Python judge', color:'#5B4DFF', icon:'</>', accent:'coding'}
  ];
  function loadBanks(){ return fetch('/data/banks.json',{cache:'default'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
    var list=(j.banks||[]).map(function(b){ var f=BANKS_FALLBACK.find(function(x){return x.id===b.id}); return f? Object.assign({},f,b): b; });
    return list.length? list: BANKS_FALLBACK;
  }).catch(function(){ return BANKS_FALLBACK; }); }
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
  var isVisible=function(t){ var s=(t.status||'ready').toLowerCase(); return s!=='pending' && s!=='outline' && s!=='hidden'; };
  loadBanks().then(function(BANKS){
    return Promise.all(BANKS.map(function(b){
      return fetch('/data/'+b.id+'.json',{cache:'default'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
        b._total=(j.topics||[]).length; b._ready=(j.topics||[]).filter(isVisible).length; b._hidden=b._total-b._ready; return b;
      }).catch(function(){ b._total=0; b._ready=0; b._hidden=0; return b; });
    }));
  }).then(function(banks){
    var totalIndexed=banks.reduce(function(a,b){return a+b._total},0);
    var totalReady=banks.reduce(function(a,b){return a+b._ready},0);
    document.getElementById('nav-stats').textContent=totalReady+' ready · '+ totalIndexed+' indexed';
    var grid=document.getElementById('grid'); var loader=document.getElementById('bank-loader'); loader.hidden=true; loader.style.display='none'; grid.hidden=false; grid.style.display='grid';
    grid.innerHTML=banks.map(function(b){
      var ready=b._ready, total=b._total, hidden=b._hidden; var pct= total? Math.round(ready/total*100):0; var isEmpty=ready===0 && total>0;
      var meta= hidden? '<span style="color:var(--text-3)">'+hidden+' hidden</span>':'<span style="color:var(--success)">all ready</span>';
      var href=b.id==='coding' ? '/coding/' : '/'+esc(b.id)+'/';
      return '<a class="b-card '+(isEmpty?'coming':'')+'" href="'+href+'" data-search="'+esc(b.title+' '+b.subtitle)+'">'
        +'<div class="b-top"><span class="b-icon '+esc(b.accent)+'">'+esc(b.icon)+'</span><span style="display:flex;gap:6px"><span class="pill '+(ready?'ready':'soon')+'">'+(isEmpty?'SOON':(ready?'READY':'EMPTY'))+'</span><span class="pill">'+ready+'/'+total+'</span></span></div>'
        +'<h3 class="b-name">'+esc(b.title)+'</h3><p class="b-sub">'+esc(b.subtitle)+'</p>'
        +'<div class="progress" style="display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:8px"><div class="track" style="flex:1;height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden"><div class="fill" style="width:'+pct+'%"></div></div><span class="p-label">'+ready+'/'+total+' · '+meta+'</span></div>'
        +'<span class="go">Open <span aria-hidden="true">→</span></span></a>';
    }).join('');
    var input=document.getElementById('bank-search');
    input.addEventListener('input',function(){
      var q=this.value.toLowerCase().trim();
      var cards=grid.querySelectorAll('.b-card');
      var any=false;
      cards.forEach(function(card){ var show=!q||(card.getAttribute('data-search')||'').toLowerCase().indexOf(q)!==-1; card.style.display=show?'':'none'; if(show) any=true; });
      document.getElementById('empty').hidden=any;
    });
  }).catch(function(e){ document.getElementById('bank-loader').textContent='Could not load banks ('+e.message+').'; });
})();
</script>
</body>
</html>
